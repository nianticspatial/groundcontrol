name: metropolis
# data_dir / satellite_dir are injected from paths.yaml at load time
resolution: 576
sampling_interval: 1
start_offset_timestamps: 3
use_temporal_subsampling: true
min_views: 21
num_subsample_cameras: 3
cropping_method: center
temporal_window_size: 7
num_max_images: 22
use_satellite: true
input_camera_names: ["CAM_FRONT"]
target_camera_names: ["CAM_LEFT", "CAM_RIGHT"]
temporal_window_start_offset: 0
temporal_window_sampling_interval: 2
single_sample_per_scene: true
satellite_configs:
  - name: metropolis_128m_4ppm
    size: 128
    ppm: 4
    resolution: 512
    rotate: false
    rotate_per_view: false
