# Configuration for SEVA model training
ray:
  num_workers: 24
  use_gpu: true
  resources_per_worker:
    a100-80gb-regular: 1

# --- Paths and Directories ---
paths:
  pretrained_weights_path: "/mnt/nas/personal/akshay/svc_checkpoint"
  output_dir: "/mnt/nas/personal/akshay/seva_training"
  # experiment_name: "satellite_ray_fused_query_ca_sep_blocks_spherical_moredata3"
  experiment_name: "ft_updated_svc_sat_ca_hires_gated_new_mlp"
  resume_from_checkpoint: "/mnt/nas/personal/akshay/seva_training/updated_svc_sat_ca/updated_svc_sat_ca.ckpt"
  vae_ckpt_path: "/mnt/nas/personal/akshay/sd_2_1_vae"
  clip_hf_hub_path: "/mnt/nas/personal/akshay/hf_hub/hub"

# --- Data Parameters ---
data:
  max_input_views: 7
  min_input_views: 1
  val_num_input_views: 3
  max_views: 21
  resolution: 576
  batch_size: 1
  num_workers: 16
  val_batch_size: 4
  val_num_workers: 8
  train_dataset_probabilities: [0.3, 0.3, 0.1, 0.07, 0.13, 0.1]
  ds_config_path: "eval"
  datasets:
    - "metropolis"
    - "argoverse"

val_data:
  val_num_input_views: 3
  max_views: 21
  resolution: 576
  batch_size: 2
  num_workers: 16
  val_batch_size: 4
  val_num_workers: 8
  ds_config_path: "eval"
  datasets:
    - "metropolis"
    - "argoverse"

# --- Training Hyperparameters ---
training:
  num_train_epochs: 100
  max_train_steps: 500000
  lr_scheduler: "cosine"
  lr_warmup_steps: 0
  log_every_n_steps: 2
  normalize_camera_poses: true
  save_top_k: 3                 # Max number of checkpoints to keep
  monitor_metric: "val/metropolis/psnr" # Metric to monitor for saving the best
  monitor_mode: "max"             # "min" for loss/error, "max" for accuracy/score
  save_last: true
  uncond_drop_prob: 0.07
  train_only_ldm_sat_ca: true
  ignore_ckpt_optimizer_states: true
  timesteps_cubic_sampling: false
  transformer_layers_to_train: ["sat_attn", "query_norm", "ff_norm", "sat_ca_adapter_mlp", "merged_query_mlp", "ff", "sat_output_norm", "sat_alpha", "mlp_alpha"]
  transformer_blocks_to_train: ["satellite_blocks"]
  other_params_to_train: ["t_embed_mlp", "ray_map_mlp", "sat_pos_mlp", "sat_embed_mlp", "merged_sat_mlp"]
  image_uncond_drop_prob: 0.20
  use_edm_weighting: false
  loss_type: "l2"
  ema:
    enabled: true
    device: "cuda" 
    every_n_steps: 1
    start_after_steps: 0
    decay: 0.995
    trainable_only: true

# --- Optimizer Hyperparameters (AdamW) ---
optimizer:
  use_8bit: true
  learning_rate: 0.0001 # 3e-5
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.001
  adam_epsilon: 0.00000001 # 1e-8
  sat_encoder_learning_rate: 0.000005 # 5e-6

# --- PyTorch Lightning Trainer Parameters ---
lightning:
  accelerator: "auto" # for ray, we don't need to specify the accelerator
  devices: "auto" # for ray, we don't need to specify the devices
  strategy: "ray_ddp"
  mixed_precision: "bf16-mixed"
  save_every_n_steps: 50
  max_grad_norm: 2.0
  accumulate_grad_batches: 8
  strict_load: false
  track_grad_norm: 2
  ema:
    enabled: true
    device: "cuda" 
    every_n_steps: 1
    start_after_steps: 0
    decay: 0.995
    trainable_only: true

# --- Model/Pipeline Specific Parameters ---
model:
  vae_downsampling_factor: 8
  cfg_scale: 4.0
  name: "satellite_ray_fused_query_ca_sep_blocks"
  use_reference_rotation: true
  using_older_ckpt: false
  per_view_satellite_cond: true
  init_norm4_from_norm3: true
  sat_ca_input_only: false
  train_sat_encoder: false
  skip_clip_attn: false
  use_learned_query: true
  sample_points_min_depth: 2.0
  sample_points_max_depth: 250.0
  num_sample_points: 20
  sat_encoder_name: "dinov3_vitl16_pretrain"
  sat_cond_dim: 1024
  ray_pos_enc_freqs: 20
  embedding_dim: 1024
  street_raymap_dim: 120 # 3 * (2 * ray_pos_enc_freqs)
  use_mlp_for_sat_ca: true
  use_mlp_for_context: false
  sat_ca_before_sa: false
  use_mlp_at_output: false
  use_mlp_for_merging_query: true
  spherical_sampling: true
  use_preprocessed_dino_features: true
  residual_sat_block: false
  img_h: 576
  img_w: 576
  use_sat_output_norm: true
  use_sat_output_gate: true
  use_mlp_output_gate: true
  reference_translation_noise_m: 10.0
  reference_rotation_noise_deg: 10.0
  use_view_embedding: true
  # cfg_scale_image: 4.0
  # cfg_scale_sat: 16.0
  # use_dual_cfg: true
  # When true and use_dual_cfg is true, also pass cond_sample_mask so satellite
  # residuals are not added for the image-only / uncond paths (not just zeroed features).
  strict_dual_cfg_sat_mask: false

validation:
  denoising_steps: 50  # Number of denoising steps
  check_every_n_epoch: 1 # Run validation every N epochs
  limit_val_batches: 1 # can also be a fraction of the val dataset
  val_check_interval: 800
