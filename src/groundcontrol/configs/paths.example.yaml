# Prefer: python scripts/download_checkpoints.py
# Or copy this file and fill in local locations:
#   cp src/groundcontrol/configs/paths.example.yaml src/groundcontrol/configs/paths.yaml
#
# paths.yaml is gitignored.

checkpoint_path: /path/to/groundcontrol.ckpt
output_dir: outputs/metropolis

pretrained_weights_path: /path/to/seva
vae_ckpt_path: /path/to/sd21
clip_hf_hub_path: /path/to/open_clip

data_dir: /path/to/metropolis
satellite_dir: /path/to/metropolis/sat_preprocessed

dinov3_repo: /path/to/dinov3
dinov3_weights: /path/to/dinov3_vitl16.pth

# Optional — required only when validation.semeval is true
dino_weights: null
sam_weights: null
